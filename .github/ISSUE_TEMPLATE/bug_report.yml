name: Bug Report (버그 리포트)
description: woongyee-blog의 버그 또는 회귀 문제를 등록합니다
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 상황
      description: 무엇이 잘못 동작하는지, 어느 파일/경로에서 발생하는지 요약합니다.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향
      description: 사용자/운영자 관점의 영향과 현재 우회 방법을 적습니다.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 재현하는 최소 절차 또는 Mock 테스트 시나리오를 적습니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 (Acceptance Criteria)
      description: 버그 수정 완료로 인정할 수 있는 검증 가능한 체크리스트입니다.
      value: |
        - [ ] 근본 원인 수정 및 `tests/` 회귀 테스트 추가
        - [ ] `npm run verify` 통과
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 대상 파일 / 범위
      description: 수정이 예상되는 파일이나 디렉토리 경로를 적습니다.
    validations:
      required: false
