name: Feature / Improvement Request (기능 및 개선 요청)
description: woongyee-blog의 새 기능, 리팩토링, 개선 작업을 제안합니다
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 상황
      description: 현재 부족한 기능이나 한계를 요약합니다.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 배경 및 기대 효과
      description: 블로그 독자 경험, 작성 워크플로우, 운영 측면에서 왜 필요한지 적습니다.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 제안 설계
      description: 사용자에게 보이는 동작, API/설정 계약, 엣지 케이스를 적습니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 (Acceptance Criteria)
      description: 완료로 간주하기 위한 검증 가능한 체크리스트입니다.
      value: |
        - [ ] 명세대로 동작 구현
        - [ ] `tests/` 단위/통합 테스트 추가 (외부 API Mock 처리)
        - [ ] `npm run verify` 통과
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 대상 파일 / 범위
      description: 수정이 예상되는 파일이나 디렉토리를 적습니다.
    validations:
      required: false
